<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StarResale Premium App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #FFD700;
      --premium: #00C6FF;
      --bg-deep: #020202;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      background-color: var(--bg-deep);
      background-image: radial-gradient(circle at 50% 40%, #151515 0%, #000000 80%);
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    #canvas-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 60%;
      z-index: 1;
      pointer-events: none;
    }

    .switcher {
      display: flex;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .switcher button {
      flex: 1;
      border: none;
      background: none;
      color: rgba(255,255,255,0.5);
      padding: 12px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .switcher button.active {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .ui-container {
      margin-top: auto;
      z-index: 10;
      padding-bottom: 20px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .ui-layer {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hidden { display: none !important; opacity: 0; transform: translateY(30px); }
    
    .fade-in { animation: fadeIn 0.6s forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .card {
      background: var(--glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 18px;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      outline: none;
      margin-bottom: 20px;
    }

    .target-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      background: rgba(0,0,0,0.2);
      padding: 4px;
      border-radius: 12px;
    }
    .target-toggle div {
      flex: 1;
      padding: 8px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      border-radius: 10px;
      color: rgba(255,255,255,0.4);
      transition: 0.2s;
    }
    .target-toggle div.active {
      background: var(--glass-border);
      color: #fff;
    }

    .username-input {
      font-size: 16px;
      padding: 12px;
      margin-bottom: 15px;
      display: none;
    }

    .premium-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .premium-option {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      padding: 15px 5px;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
    }
    .premium-option.active {
      border-color: var(--premium);
      background: rgba(0, 198, 255, 0.1);
    }
    .premium-option .months { display: block; font-weight: 800; font-size: 16px; }
    .premium-option .price { display: block; font-size: 12px; opacity: 0.6; margin-top: 4px; }

    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      font-weight: 800;
      font-size: 16px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
    }

    .btn-main {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000;
      box-shadow: 0 10px 25px rgba(255, 215, 0, 0.2);
    }
    
    .btn-premium {
        background: linear-gradient(135deg, #00C6FF, #0072FF);
        color: #fff;
        box-shadow: 0 10px 25px rgba(0, 198, 255, 0.2);
    }

    /* Стили изменены под новые платежные шлюзы */
    .btn-card { background: #ffffff; color: #000000; margin-bottom: 12px; }
    .btn-crypto { background: #333; color: #fff; }

    .price-tag {
      font-size: 36px;
      font-weight: 900;
      color: var(--primary);
      margin: 10px 0;
      text-shadow: 0 0 20px rgba(255,215,0,0.3);
    }

    .loader {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #FFD700;
      border-radius: 50%;
      width: 24px; height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .waiting-box {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="app">
    <div class="switcher">
      <button id="tab-stars-btn" class="active" onclick="switchTab('stars')">Звезды</button>
      <button id="tab-premium-btn" onclick="switchTab('premium')">Премиум</button>
    </div>

   <div class="ui-container">
  
      <!-- ВКЛАДКА: ЗВЕЗДЫ -->
      <div id="tab-stars" class="tab-content active">
          <div id="step-1" class="ui-layer">
            <div class="card">
              <div class="target-toggle">
                  <div class="active" onclick="setTarget('stars', 'me', this)">КУПИТЬ СЕБЕ</div>
                  <div onclick="setTarget('stars', 'friend', this)">ДЛЯ ДРУГА</div>
              </div>
              <input type="text" id="starsFriendUser" class="username-input" placeholder="@username">
              <div style="text-align:center; opacity:0.6; margin-bottom:15px; font-size:12px; text-transform:uppercase;">Введите количество</div>
              <input type="number" id="starsAmount" value="50" min="50">
              <button class="btn btn-main" onclick="toStep2()">Продолжить</button>
            </div>
          </div>

          <div id="step-2" class="ui-layer hidden">
            <div class="card">
              <div style="text-align:center; opacity:0.6; margin-bottom:20px; font-size:12px; text-transform:uppercase;">Выберите способ</div>
              <!-- ЗАМЕНА: Вместо СБП выводим Банковскую карту (1Plat) -->
              <button class="btn btn-card" onclick="processPay('card')">💳 Банковская карта</button>
              <button class="btn btn-crypto" onclick="processPay('crypto')">₿ Криптовалюта</button>
              <button style="background:none; border:none; color:#555; width:100%; margin-top:15px;" onclick="backTo(1)">Назад</button>
            </div>
          </div>
      </div>

      <!-- ВКЛАДКА: ПРЕМИУМ -->
      <div id="tab-premium" class="tab-content">
          <div id="premium-step-1" class="ui-layer">
              <div class="card">
                  <div class="target-toggle">
                      <div class="active" onclick="setTarget('premium', 'me', this)">КУПИТЬ СЕБЕ</div>
                      <div onclick="setTarget('premium', 'friend', this)">ДЛЯ ДРУГА</div>
                  </div>
                  <input type="text" id="premiumFriendUser" class="username-input" placeholder="@username">
                  <div class="premium-grid">
                      <div class="premium-option" onclick="selectPremium(3, 1100, this)">
                          <span class="months">3 МЕС.</span>
                          <span class="price">1100 ₽</span>
                      </div>
                      <div class="premium-option active" onclick="selectPremium(6, 1600, this)">
                          <span class="months">6 МЕС.</span>
                          <span class="price">1600 ₽</span>
                      </div>
                      <div class="premium-option" onclick="selectPremium(12, 3000, this)">
                          <span class="months">12 МЕС.</span>
                          <span class="price">3000 ₽</span>
                      </div>
                  </div>
                  <button class="btn btn-premium" onclick="toPremiumStep2()">Продолжить</button>
              </div>
          </div>

          <div id="premium-step-2" class="ui-layer hidden">
              <div class="card">
                <div style="text-align:center; opacity:0.6; margin-bottom:20px; font-size:12px; text-transform:uppercase;">Выберите способ</div>
                <!-- ЗАМЕНА: Вместо СБП выводим Банковскую карту (1Plat) -->
                <button class="btn btn-card" onclick="processPremiumPay('card')">💳 Банковская карта</button>
                <button class="btn btn-crypto" onclick="processPremiumPay('crypto')">₿ Криптовалюта</button>
                <button style="background:none; border:none; color:#555; width:100%; margin-top:15px;" onclick="backToPremium(1)">Назад</button>
              </div>
          </div>
      </div>

      <!-- ЭКРАН 3: ОЖИДАНИЕ / ССЫЛКА НА ОПЛАТУ -->
      <div id="step-3" class="ui-layer hidden">
        <div class="card" style="text-align:center;">
          <div id="pay-loader" style="display:flex; flex-direction:column; align-items:center; gap:15px;">
            <div class="loader"></div>
            <div style="font-size:14px;">Генерируем счет...</div>
          </div>
          
          <div id="pay-content" class="hidden">
            <div style="font-size:12px; opacity:0.6;">К оплате</div>
            <div class="price-tag" id="finalPrice">0 ₽</div>
            <a id="payLink" href="#" target="_blank" class="btn btn-main">Оплатить заказ</a>
            <div class="waiting-box">
                <div class="loader"></div>
                <div style="font-size:12px; letter-spacing:1px;">ОЖИДАЕМ ПОДТВЕРЖДЕНИЯ...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ЭКРАН 4: УСПЕХ -->
      <div id="step-4" class="ui-layer hidden" style="text-align:center;">
        <div style="font-size:60px; margin-bottom:10px;">✨</div>
        <h2 style="margin:0;">Оплачено!</h2>
        <p style="opacity:0.6;">Заказ успешно выполнен</p>
        <button class="btn btn-main" style="margin-top:20px;" onclick="tg.close()">Вернуться в бот</button>
      </div>

    </div>
  </div>

 <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Твой прокси-домен Cloudflare Workers
    const API_BASE = "https://still-resonance-a37f.awesome-nn44.workers.dev"; 

    let currentOrder = { amount: 50, price: 0, id: null, type: 'stars' };
    let premiumOrder = { months: 6, price: 1600 }; // Исправлен дефолтный баланс цены
    let pollingInterval = null; 
    let purchaseTarget = { stars: 'me', premium: 'me' };

   function switchTab(tab) {
    document.querySelector('.switcher').style.display = 'flex';
    currentOrder.type = tab;
    
    document.getElementById('tab-stars-btn').classList.toggle('active', tab === 'stars');
    document.getElementById('tab-premium-btn').classList.toggle('active', tab === 'premium');
    
    document.getElementById('tab-stars').classList.toggle('active', tab === 'stars');
    document.getElementById('tab-premium').classList.toggle('active', tab === 'premium');

    document.querySelectorAll('.ui-layer').forEach(l => l.classList.add('hidden'));
    if (tab === 'stars') {
        document.getElementById('step-1').classList.remove('hidden');
    } else {
        document.getElementById('premium-step-1').classList.remove('hidden');
    }

    if (tab === 'premium') {
        gsap.to(star.material.color, { r: 0, g: 0.77, b: 1, duration: 0.5 });
    } else {
        gsap.to(star.material.color, { r: 1, g: 0.84, b: 0, duration: 0.5 });
    }
}

    function setTarget(tab, target, el) {
        purchaseTarget[tab] = target;
        const parent = el.parentElement;
        parent.querySelectorAll('div').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
        
        const inputId = tab === 'stars' ? 'starsFriendUser' : 'premiumFriendUser';
        document.getElementById(inputId).style.display = target === 'friend' ? 'block' : 'none';
    }

    function selectPremium(months, price, el) {
        premiumOrder.months = months;
        premiumOrder.price = price;

        document.querySelectorAll('.premium-option').forEach(card => card.classList.remove('active'));
        el.classList.add('active');
    }

    function toStep2() {
      const val = parseInt(document.getElementById('starsAmount').value);
      if (val < 50) { tg.showAlert("Минимум 50 звезд"); return; }
      currentOrder.amount = val;
      currentOrder.price = val * 1.3; 
      showLayer(2);
      moveCamera(3.5);
    }
  
   async function processPay(method) {
        let targetUsername = null;
        if (purchaseTarget.stars === 'friend') {
            targetUsername = document.getElementById('starsFriendUser').value;
            if (!targetUsername) {
                tg.showAlert("Пожалуйста, введите @username друга");
                return;
            }
        }

        await createPaymentRequest({
            userId: tg.initDataUnsafe?.user?.id || 0, 
            orderType: 'stars',
            starsCount: parseInt(currentOrder.amount),
            method: method, // Передаем 'card' или 'crypto'
            targetUsername: targetUsername
        });
    }

  function toPremiumStep2() {
    document.getElementById('premium-step-1').classList.add('hidden');
    document.getElementById('premium-step-2').classList.remove('hidden');
    document.getElementById('premium-step-2').classList.add('fade-in');
    moveCamera(3.5);
}

   function backToPremium(step) {
    document.getElementById('premium-step-2').classList.add('hidden');
    document.getElementById('premium-step-1').classList.remove('hidden');
    moveCamera(5);
}

  async function processPremiumPay(method) {
    let targetUsername = null;
    if (purchaseTarget.premium === 'friend') {
        targetUsername = document.getElementById('premiumFriendUser').value;
        if (!targetUsername) {
            tg.showAlert("Пожалуйста, введите @username друга");
            return;
        }
    }

    document.getElementById('premium-step-2').classList.add('hidden');
    
    await createPaymentRequest({
        userId: tg.initDataUnsafe?.user?.id || 0,
        orderType: 'premium',
        months: premiumOrder.months,
        method: method, // Передаем 'card' или 'crypto'
        targetUsername: targetUsername
    });
}

   async function createPaymentRequest(payload) {
        if (payload.orderType === 'premium' && !payload.months) {
            tg.showAlert("Пожалуйста, выберите тариф Premium!");
            return;
        }

        showLayer(3); 
        document.getElementById('pay-loader').classList.remove('hidden');
        document.getElementById('pay-content').classList.add('hidden');

        try {
            // Запрос на твой C# бэкенд или промежуточный сервис для генерации инвойса
            const response = await fetch(`${API_BASE}/create-mini-app-payment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.success && data.payUrl) {
                document.getElementById('pay-loader').classList.add('hidden');
                document.getElementById('pay-content').classList.remove('hidden');

                const finalPrice = data.amount || (payload.orderType === 'stars' ? payload.starsCount * 1.3 : premiumOrder.price);
                document.getElementById('finalPrice').innerText = Math.round(finalPrice) + " ₽";
                
                const payLink = document.getElementById('payLink');
                
                payLink.onclick = function(e) {
                    e.preventDefault();
                    if (tg.openLink) {
                        tg.openLink(data.payUrl);
                    } else {
                        window.open(data.payUrl, '_blank');
                    }
                };

                // Запускаем опрос нашего воркера
                startPolling(data.guid || data.payment_id);
            } else {
                throw new Error(data.message || "Ошибка сервера при создании счета");
            }
        } catch (e) {
            console.error("Критическая ошибка:", e);
            tg.showAlert("Ошибка: " + e.message);
            backTo(payload.orderType === 'stars' ? 2 : 1);
        }
    }

function startPolling(txId) {
    if (window.pollingInterval) {
        clearInterval(window.pollingInterval);
    }

    // Опрашиваем созданный в Cloudflare эндпоинт /check
    window.pollingInterval = setInterval(async () => {
        try {
            const res = await fetch(`${API_BASE}/check?txId=${txId}`);
            const data = await res.json();

            console.log("Статус платежа из KV:", data.status);

            if (data.status === 'paid') {
                clearInterval(window.pollingInterval);
                handleSuccess();
            } else if (data.status === 'cancelled') {
                clearInterval(window.pollingInterval);
                tg.showAlert("Ошибка: Платеж был отменен или отклонен реквизитами.");
                backTo(1);
            }
        } catch (e) {
            console.error("Ошибка полинга статуса:", e);
        }
    }, 3000);
}

    function handleSuccess() {
      document.getElementById('step-3').classList.add('hidden');
      explodeStar();
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#FFD700', '#FFA500'] });
      showLayer(4);
    }

function backTo(step) {
    if (window.pollingInterval) clearInterval(window.pollingInterval);
    
    document.getElementById('pay-loader').classList.remove('hidden');
    document.getElementById('pay-content').classList.add('hidden');

    if (currentOrder.type === 'premium') {
        document.querySelectorAll('.ui-layer').forEach(l => l.classList.add('hidden'));
        document.getElementById('tab-premium').classList.add('active');
        const premStep = document.getElementById('premium-step-' + step);
        if (premStep) {
            premStep.classList.remove('hidden');
            premStep.classList.add('fade-in');
        }
    } else {
        showLayer(step);
    }
    moveCamera(5); 
}

     function showLayer(step) {
        document.querySelectorAll('.ui-layer').forEach(l => l.classList.add('hidden'));
    
        if (step === 3 || step === 4) {
            document.querySelector('.switcher').style.display = 'none';
            document.getElementById('tab-stars').classList.remove('active');
            document.getElementById('tab-premium').classList.remove('active');
        } else {
            document.querySelector('.switcher').style.display = 'flex';
            if (currentOrder.type === 'stars') {
                document.getElementById('tab-stars').classList.add('active');
            } else {
                document.getElementById('tab-premium').classList.add('active');
            }
        }
    
        const el = document.getElementById('step-' + step);
        if (el) {
            el.classList.remove('hidden');
            el.classList.add('fade-in');
        }
    }

    // --- THREE.JS СЦЕНА ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / (window.innerHeight * 0.6), 0.1, 1000);
    camera.position.z = 5;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight * 0.6);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    function createBubblyStar() {
      const shape = new THREE.Shape();
      const points = 5;
      const rOut = 1.2; const rIn = 0.7;
      for (let i = 0; i < points * 2; i++) {
        const a = (i * Math.PI) / points - Math.PI/2;
        const r = i % 2 === 0 ? rOut : rIn;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) shape.moveTo(x, y);
        else shape.quadraticCurveTo(0, 0, x, y);
      }
      return shape;
    }

    const starGeo = new THREE.ExtrudeGeometry(createBubblyStar(), {
      depth: 0.4, bevelEnabled: true, bevelThickness: 0.4, bevelSize: 0.3, bevelSegments: 12
    });
    starGeo.center();
    const starMat = new THREE.MeshStandardMaterial({
      color: 0xFFD700, metalness: 0.1, roughness: 0.05,
      emissive: 0xFFD700, emissiveIntensity: 0.1, transparent: true
    });
    const star = new THREE.Mesh(starGeo, starMat);
    scene.add(star);

    const glowGeo = new THREE.PlaneGeometry(4.5, 4.5);
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = 256; glowCanvas.height = 256;
    const ctx = glowCanvas.getContext('2d');
    const grad = ctx.createRadialGradient(128,128,0, 128,128,120);
    grad.addColorStop(0, 'rgba(255, 215, 0, 0.4)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
    const glowMat = new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(glowCanvas), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.z = -0.5;
    scene.add(glow);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const directLight = new THREE.DirectionalLight(0xffffff, 1);
    directLight.position.set(5, 5, 5);
    scene.add(directLight);

    function moveCamera(z) { gsap.to(camera.position, { z: z, duration: 1.2, ease: "power2.out" }); }

    let particles = [];
    let explosionActive = false;

    function explodeStar() {
        explosionActive = true;
        gsap.to(star.scale, { x: 0, y: 0, z: 0, duration: 0.4, ease: "back.in(2)" });
        gsap.to(glow.material, { opacity: 0, duration: 0.4 });
        const pCount = 200;
        const pGeo = new THREE.IcosahedronGeometry(0.1, 0);
        const pMat = new THREE.MeshBasicMaterial({ color: star.material.color });
        for (let i = 0; i < pCount; i++) {
            const p = new THREE.Mesh(pGeo, pMat);
            p.position.copy(star.position);
            p.userData.velocity = new THREE.Vector3((Math.random()-0.5)*0.4, (Math.random()-0.5)*0.4, (Math.random()-0.5)*0.4);
            particles.push(p);
            scene.add(p);
        }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!explosionActive) {
          star.rotation.y += 0.015;
          star.rotation.x = Math.sin(Date.now()*0.001)*0.2;
      } else {
          particles.forEach((p, idx) => {
              p.position.add(p.userData.velocity);
              p.userData.velocity.y += 0.012; 
              if (p.position.y > 10) { scene.remove(p); particles.splice(idx, 1); }
          });
      }
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
